name: Cópia de segurança

# Todo dia 1 às 03:00 de São Paulo (06:00 UTC), pelo botão "Run workflow" na aba Actions, e quando
# a própria rotina muda (para testar no ramo). Exporta o banco e os arquivos, restaura num Supabase
# vazio aqui mesmo, confere as contagens e guarda o pacote por 90 dias. Só lê a origem.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copia-de-seguranca.yml
      - scripts/copia/**

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Origem: o banco de teste, por enquanto. Quando existir o banco de produção, trocar pelos
      # segredos SUPABASE_ACCESS_TOKEN_PRODUCAO e SUPABASE_REF_PRODUCAO (veja o manual).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_ORIGEM: ${{ secrets.SUPABASE_REF_TESTE }}
      # No Supabase local, o superusuário é supabase_admin (o postgres não pode aplicar alguns
      # ajustes que vêm nos papéis da cópia, como log_min_messages).
      BANCO_RESTAURADO: postgresql://supabase_admin:postgres@127.0.0.1:55322/postgres
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Liga ao banco de origem
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF_ORIGEM" ]; then
            echo "::error::Segredos do Supabase da origem não configurados no GitHub."
            exit 1
          fi
          npx supabase link --project-ref "$REF_ORIGEM"

      - name: Exporta o banco (papéis, estrutura e dados)
        run: |
          set -euo pipefail
          mkdir -p copia
          npx supabase db dump --linked --role-only -f copia/roles.sql
          npx supabase db dump --linked -f copia/schema.sql
          npx supabase db dump --linked --data-only --use-copy -f copia/data.sql
          ls -l copia

      - name: Baixa os arquivos (fotos e XMLs das notas)
        run: |
          set -euo pipefail
          : > copia/arquivos.txt
          for deposito in fotos-produtos notas-xml; do
            mkdir -p "copia/arquivos/$deposito"
            listados=$(npx supabase storage ls -r --linked --experimental "ss:///$deposito" | grep -v '/$' | grep -c . || true)
            if [ "$listados" -gt 0 ]; then
              npx supabase storage cp -r --linked --experimental -j 4 "ss:///$deposito" "copia/arquivos/$deposito"
            fi
            baixados=$(find "copia/arquivos/$deposito" -type f | wc -l)
            echo "$deposito $listados $baixados" >> copia/arquivos.txt
          done
          cat copia/arquivos.txt

      - name: Cria um Supabase vazio para restaurar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restaurar"
          npx supabase --workdir "$RUNNER_TEMP/restaurar" init
          # Portas 553xx em vez das 543xx: às vezes a máquina do GitHub já tem a 54322 ocupada.
          sed -i -E 's/\b543([0-9]{2})\b/553\1/g' "$RUNNER_TEMP/restaurar/supabase/config.toml"
          grep -nE '^port|_port' "$RUNNER_TEMP/restaurar/supabase/config.toml" | head -8
          # Mesmas versões do banco, do login e do Storage da origem (gravadas pelo "supabase link"):
          # sem isso, as tabelas de login do Supabase local podem ter colunas a menos que a cópia.
          mkdir -p "$RUNNER_TEMP/restaurar/supabase/.temp"
          for arquivo in supabase/.temp/*-version supabase/.temp/storage-migration; do
            if [ -f "$arquivo" ]; then cp "$arquivo" "$RUNNER_TEMP/restaurar/supabase/.temp/"; fi
          done
          ls "$RUNNER_TEMP/restaurar/supabase/.temp"
          npx supabase --workdir "$RUNNER_TEMP/restaurar" start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor

      - name: Restaura a cópia
        run: |
          set -euo pipefail
          psql --single-transaction --variable ON_ERROR_STOP=1 \
            --file copia/roles.sql \
            --file copia/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file copia/data.sql \
            --dbname "$BANCO_RESTAURADO"

      - name: Confere o banco restaurado
        run: node scripts/copia/conferir.mjs copia/data.sql "$BANCO_RESTAURADO"

      - name: Confere os arquivos
        run: |
          set -euo pipefail
          {
            echo "### Conferência dos arquivos"
            echo ""
            echo "| Depósito | No Storage | Baixados |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          falhou=0
          while read -r deposito listados baixados; do
            echo "| $deposito | $listados | $baixados |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$listados" != "$baixados" ]; then
              echo "::error::$deposito: $listados no Storage, $baixados baixados."
              falhou=1
            fi
          done < copia/arquivos.txt
          exit $falhou

      - name: Nome do pacote (data de São Paulo)
        id: nome
        run: echo "pacote=copia-$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_OUTPUT"

      - name: Guarda a cópia por 90 dias
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nome.outputs.pacote }}
          path: copia/
          retention-days: 90
          if-no-files-found: error
