name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Supabase local (só banco, login e e-mails de teste)
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm run env:local
      - name: Testes do banco
        run: |
          if [ -d supabase/tests ]; then npx supabase test db; else echo "Sem testes de banco ainda."; fi
      - run: npm run build
