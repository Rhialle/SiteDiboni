name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Daqui em diante cada verificação roda mesmo se uma anterior falhou (o job continua vermelho),
      # para uma rodada só mostrar todas as falhas.
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - name: Supabase local (só banco, login e e-mails de teste)
        id: supabase
        if: ${{ !cancelled() }}
        run: npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - run: npm run env:local
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
      - name: Testes do banco
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: |
          if [ -d supabase/tests ]; then npx supabase test db; else echo "Sem testes de banco ainda."; fi
      - name: Testes de concorrência (duas conexões ao mesmo tempo)
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: npm run test:concorrencia
      - run: npm run build
        id: build
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      - name: Testes de tela
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e
      - name: Guarda o relatório dos testes de tela
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report
            test-results
      - name: Tipos do banco atualizados
        if: success() || failure()
        run: |
          npm run db:tipos
          git diff --exit-code src/lib/supabase/tipos.ts || (echo "Tipos desatualizados: baixe o artefato tipos-do-banco e salve em src/lib/supabase/tipos.ts" && exit 1)
      - name: Guarda os tipos gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tipos-do-banco
          path: src/lib/supabase/tipos.ts

  # Depois dos testes, leva as migrações para o banco de TESTE na nuvem (usado pelas pré-visualizações).
  banco-teste:
    needs: testes
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_REF_TESTE: ${{ secrets.SUPABASE_REF_TESTE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Aplica as migrações no banco de teste
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_REF_TESTE" ]; then
            echo "::warning::Segredos do Supabase de teste não configurados no GitHub; migrações não aplicadas."
            exit 0
          fi
          # Com o token, o CLI usa um acesso temporário: não precisa da senha do banco.
          npx supabase link --project-ref "$SUPABASE_REF_TESTE"
          npx supabase db push
